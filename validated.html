<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validé | SoloPrice Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            animation: scaleIn 0.5s 0.2s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        h1 {
            margin: 0 0 1rem;
            color: var(--primary-light);
        }

        p {
            opacity: 0.8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .button-primary {
            display: inline-block;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--primary-glass);
        }
    </style>
</head>

<body>
    <div class="container glass">
        <div class="icon">🎉</div>
        <h1>Email Validé !</h1>
        <p>Votre compte SoloPrice Pro est maintenant actif. Vous pouvez dès à présent accéder à tous vos outils de
            gestion.</p>
        <a href="index.html" class="button-primary">C'est parti !</a>
    </div>
</body>

</html>
